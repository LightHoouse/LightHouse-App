name: CI and release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test chat-placement.test.mjs recovery.test.mjs

  package:
    needs: verify
    runs-on: windows-latest
    env:
      LIGHTHOUSE_E2E_BACKEND_DIR: backend-test
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: LightHoouse/LightHosue-Backend
          ref: f2b7ff42522c33cbdb9dc2ca9c7b0dc73264e745
          path: backend-test
      - name: Prepare isolated backend for desktop E2E
        run: |
          npm --prefix backend-test ci
          npm --prefix backend-test run build
      - name: Set and validate release version
        id: version
        shell: pwsh
        run: |
          $base = (Get-Content package.json | ConvertFrom-Json).version.Split('-')[0]
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected a vX.Y.Z release tag' }
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version -ne $base) { throw 'Release tag must match package.json version' }
          } else {
            $version = "$base-ci.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          }
          npm version $version --no-git-tag-version --allow-same-version
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: npm test
      - run: npm run package
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $env:LIGHTHOUSE_TEST_EXE = "$pwd/release/win-unpacked/Lighthouse.exe"
          npx playwright test
      - name: Verify installed branding and recording association
        shell: pwsh
        run: ./scripts/verify-install.ps1
      - name: Manifest and checksums for verified installer
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | Rename-Item -NewName { $_.Name.Replace(' ', '.') }
          @{
            version = '${{ steps.version.outputs.version }}'
            commit = $env:GITHUB_SHA
            platform = 'windows-x64'
            electron = (node -p "require('./node_modules/electron/package.json').version")
            workflow = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            verification = @('typecheck', 'two-client-source-e2e', 'two-client-packaged-e2e', 'native-uia-record-and-resolve', 'offline-crash-recovery', 'observed-outcome-regression', 'portable-import-export', 'classroom-cache', 'native-drag-scroll')
          } | ConvertTo-Json | Set-Content -Encoding utf8 release/release-manifest.json
          Get-ChildItem release/*.exe,release/release-manifest.json | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-windows-installer
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/release-manifest.json
          if-no-files-found: error

  package-macos:
    needs: verify
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set release version
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('-')[0]")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" == "$base" ]] || { echo 'Release tag must match package.json version'; exit 1; }
          else
            version="${base}-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm run check
      - run: npm run package:mac
      - name: Create macOS checksums
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.zip)
          sha256sum "${files[@]}" > release/SHA256SUMS-macos.txt
          cat > release/release-manifest-macos.json <<EOF
          {"version":"${{ steps.version.outputs.version }}","commit":"$GITHUB_SHA","platform":"macos-x64","verification":["typecheck","electron-builder-macos-package"]}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-macos-installer
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-macos.txt
            release/release-manifest-macos.json
          if-no-files-found: error

  release:
    needs: [verify, package, package-macos]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lighthouse-windows-installer
          path: release
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Publish tested Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -f "source/docs/releases/$VERSION.md"
          cp "source/docs/releases/$VERSION.md" notes.md
          printf '\n\nSource commit: `%s`. [Passed build and desktop checks](%s).\n' "$COMMIT" "$RUN_URL" >> notes.md
          gh release create "v$VERSION" release/*.exe release/SHA256SUMS.txt release/release-manifest.json --repo "$GH_REPO" --verify-tag --title "Lighthouse $VERSION" --notes-file notes.md --latest
      - uses: actions/download-artifact@v4
        with:
          name: lighthouse-macos-installer
          path: release-macos
      - name: Add macOS assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        run: gh release upload "v$VERSION" release-macos/* --repo "$GH_REPO" --clobber


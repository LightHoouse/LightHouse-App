<!doctype html><html lang="id"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title>Lighthouse Recorder</title><link rel="stylesheet" href="style.css"></head><body class="floating"><div class="recorder"><button id="group" class="icon logo-button" aria-label="Buka group"><i class="brand"></i></button><div class="record-info"><span id="record-label">Siap merekam</span><span id="clock">Satu sesi, semua aplikasi</span></div><div class="record-controls"><button id="record" class="record-button" aria-label="Mulai merekam"><i class="record-dot"></i>Rekam</button><button id="pause" class="icon" aria-label="Jeda rekaman" hidden>Ⅱ</button><button id="resume" class="icon" aria-label="Lanjutkan rekaman" hidden>▶</button><button id="stop" class="icon stop" aria-label="Simpan rekaman" hidden>■</button></div><button id="copy" class="code-button" aria-label="Salin kode group"></button></div><script src="toolbar.js"></script></body></html>

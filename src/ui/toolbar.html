<!doctype html><html lang="id"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title>Lighthouse Recorder</title><link rel="stylesheet" href="style.css"></head><body class="floating"><div class="recorder"><button id="group" class="icon logo-button" aria-label="Buka group"><i class="brand"></i></button><div class="record-info"><span id="record-label">Siap merekam</span><span id="clock">Satu sesi, semua aplikasi</span><select id="display-select" class="display-select" aria-label="Pilih layar rekaman" hidden></select></div><div class="record-controls"><button id="record" class="record-button" aria-label="Mulai merekam"><i class="record-dot"></i>Rekam</button><button id="pause" class="icon" aria-label="Jeda rekaman" title="Jeda rekaman" hidden><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button><button id="resume" class="icon" aria-label="Lanjutkan rekaman" title="Lanjutkan rekaman" hidden><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8a1 1 0 0 1 1.5-.86l12 7.2a1 1 0 0 1 0 1.72l-12 7.2A1 1 0 0 1 7 19.2z"/></svg></button><button id="stop" class="icon stop" aria-label="Hentikan rekaman" title="Hentikan rekaman" hidden><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg></button></div><button id="copy" class="code-button" aria-label="Salin kode group"></button></div><script src="toolbar.js"></script></body></html>

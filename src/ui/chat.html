<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title>Lighthouse Chat</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="chat.css"></head>
<body class="floating compact">
<section class="cursor-chat">
<form id="ask-form" class="ask-pill">
<textarea id="question" aria-label="Pertanyaan" placeholder="Tanya sesuatu..." rows="1" maxlength="1000"></textarea>
<button id="send" class="sr-only" type="submit" aria-label="Kirim pertanyaan">Kirim</button>
</form>
<div class="reply-card"><div class="reply-heading"><span>Lighthouse</span><span id="context"></span></div><div id="messages" aria-live="polite" role="log"></div></div>
</section><script src="chat.js"></script></body></html>
